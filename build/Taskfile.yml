version: "3"

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:{{.PACKAGE_MANAGER}}

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: where npm
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install

  install:frontend:deps:bun:
    dir: frontend
    sources:
      - package.json
      - bun.lock
      - bun.lockb
    generates:
      - node_modules
    preconditions:
      - sh: bun --version
        msg: "bun not found"
    cmds:
      - bun install

  install:frontend:deps:pnpm:
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found"
    cmds:
      - pnpm install

  install:frontend:deps:yarn:
    dir: frontend
    sources:
      - package.json
      - yarn.lock
    status:
      - test -d node_modules || test -f .pnp.cjs
    preconditions:
      - sh: yarn --version
        msg: "yarn not found"
    cmds:
      - yarn install

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER={{.PACKAGE_MANAGER}})
    summary: Build the frontend project
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with selected runner
    cmds:
      - task: frontend:run:{{.PACKAGE_MANAGER}}
        vars:
          SCRIPT: "{{.SCRIPT}}"
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:npm:
    dir: frontend
    cmds:
      - npm run {{.SCRIPT}} -q
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:yarn:
    dir: frontend
    cmds:
      - yarn {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:pnpm:
    dir: frontend
    cmds:
      - pnpm run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:bun:
    dir: frontend
    cmds:
      - bun run {{.SCRIPT}}
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:vendor:puppertino:
    summary: Fetches Puppertino CSS into frontend/public for consistent mobile styling
    sources:
      - frontend/public/puppertino/puppertino.css
    generates:
      - frontend/public/puppertino/puppertino.css
    cmds:
      - |
        set -euo pipefail
        mkdir -p frontend/public/puppertino
        # If bundled Puppertino exists, prefer it. Otherwise, try to fetch, but don't fail build on error.
        if [ ! -f frontend/public/puppertino/puppertino.css ]; then
          echo "No bundled Puppertino found. Attempting to fetch from GitHub..."
          if curl -fsSL https://raw.githubusercontent.com/codedgar/Puppertino/main/dist/css/full.css -o frontend/public/puppertino/puppertino.css; then
            curl -fsSL https://raw.githubusercontent.com/codedgar/Puppertino/main/LICENSE -o frontend/public/puppertino/LICENSE || true
            echo "Puppertino CSS downloaded to frontend/public/puppertino/puppertino.css"
          else
            echo "Warning: Could not fetch Puppertino CSS. Proceeding without download since template may bundle it."
          fi
        else
          echo "Using bundled Puppertino at frontend/public/puppertino/puppertino.css"
        fi
        # Ensure index.html includes Puppertino CSS and button classes
        INDEX_HTML=frontend/index.html
        if [ -f "$INDEX_HTML" ]; then
          if ! grep -q 'href="/puppertino/puppertino.css"' "$INDEX_HTML"; then
            # Insert Puppertino link tag after style.css link
            awk '
              /href="\/style.css"\/?/ && !x { print; print "    <link rel=\"stylesheet\" href=\"/puppertino/puppertino.css\"/>"; x=1; next }1
            ' "$INDEX_HTML" > "$INDEX_HTML.tmp" && mv "$INDEX_HTML.tmp" "$INDEX_HTML"
          fi
          # Replace default .btn with Puppertino primary button classes if present
          sed -E -i'' 's/class=\"btn\"/class=\"p-btn p-prim-col\"/g' "$INDEX_HTML" || true
        fi

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings ./cmd/vestige -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    summary: Generates Windows `.ico` from an image.
    run: once
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "windows/icon.ico"
      - "darwin/icon.icns"
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico -macfilename darwin/icon.icns

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:{{.PACKAGE_MANAGER}}

  frontend:dev:npm:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  frontend:dev:yarn:
    dir: frontend
    cmds:
      - yarn dev --port {{.VITE_PORT}} --strictPort

  frontend:dev:pnpm:
    dir: frontend
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort

  frontend:dev:bun:
    dir: frontend
    cmds:
      - bun run dev --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds a production server binary by default: -tags server,production,
      -trimpath and a stripped binary, mirroring the desktop `build` task.
      Server mode runs as a pure HTTP server without native GUI dependencies.

      Usage: task build:server [DEV=true] [OBFUSCATED=true] [EXTRA_TAGS=tag1,tag2]
        DEV=true        development server (-tags server, no strip, inlining kept)
        OBFUSCATED=true obfuscated build via garble (requires garble installed)
        EXTRA_TAGS      additional comma-separated build tags
    deps:
      - task: build:frontend
        vars:
          DEV:
            ref: .DEV
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'
    vars:
      BUILD_FLAGS: '-tags server{{if eq .DEV "true"}}{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}},production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s"{{end}}'

  run:server:
    summary: Builds and runs a development server (DEV=true)
    deps:
      - task: build:server
        vars:
          DEV: "true"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'

  build:docker:
    summary: Builds a Docker image for server mode deployment
    desc: |
      Creates a minimal Docker image containing the production server binary.
      Defaults to a pure-Go static binary on a distroless/static base. The
      production frontend is built first so the embedded assets are current.

      Usage: task build:docker [TAG=myapp:latest] [CGO_ENABLED=1] [GO_IMAGE=...] [RUNTIME_IMAGE=...]
      For CGO apps, set CGO_ENABLED=1 with libc-compatible builder/runtime images, e.g.:
        task build:docker CGO_ENABLED=1 GO_IMAGE=golang:bookworm RUNTIME_IMAGE=gcr.io/distroless/base-debian12
    deps:
      - task: build:frontend
        vars:
          BUILD_FLAGS: "-tags server,production"
    cmds:
      - >-
        docker build
        --build-arg CGO_ENABLED={{.CGO_ENABLED | default "0"}}
        --build-arg GO_IMAGE={{.GO_IMAGE | default "golang:alpine"}}
        --build-arg RUNTIME_IMAGE={{.RUNTIME_IMAGE | default "gcr.io/distroless/static-debian12"}}
        -t {{.TAG | default (printf "%s:latest" .APP_NAME)}}
        -f build/docker/Dockerfile.server .
    vars:
      TAG: "{{.TAG}}"
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."
      - sh: test -f build/docker/Dockerfile.server
        msg: "Dockerfile.server not found. Run 'wails3 update build-assets' to generate it."

  run:docker:
    summary: Builds and runs the Docker image
    desc: |
      Builds the Docker image and runs it, exposing port 8080.
      Usage: task run:docker [TAG=myapp:latest] [PORT=8080]
      Note: The internal container port is always 8080. The PORT variable
      only changes the host port mapping. Ensure your app uses port 8080
      or modify the Dockerfile to match your ServerOptions.Port setting.
    deps:
      - task: build:docker
        vars:
          TAG:
            ref: .TAG
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 {{.TAG | default (printf "%s:latest" .APP_NAME)}}
    vars:
      TAG: "{{.TAG}}"
      PORT: "{{.PORT}}"

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    desc: |
      Builds the Docker image needed for cross-compiling to any platform.
      Run this once to enable cross-platform builds from any OS.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  # --- Chromium bundling (blueprint §7 item 10 — resolved: bundle at build time) ---
  #
  # Windows-only, matching the project's current release scope (Linux/macOS
  # dropped). Downloads the pinned Chrome for Testing headless-shell build
  # and extracts it to bin/chromium/headless-shell.exe — the exact relative
  # layout internal/browser/session.go's bundledChromiumExecPath() expects
  # next to the installed application's own executable, and the exact path
  # project.nsi's `File` directive embeds into the NSIS installer.
  vendor:chromium:
    summary: Downloads the pinned headless-shell build (Windows only)
    vars:
      # Pinned to a confirmed Chrome for Testing "known-good" version — every
      # platform's chrome-headless-shell asset verified present at this
      # version. NOT the same as whatever system Chrome chromedp might
      # auto-detect locally if no bundle is present — update this single
      # value to re-pin deliberately.
      CHROMIUM_VERSION: '{{.CHROMIUM_VERSION | default "150.0.7871.49"}}'
      DEST_DIR: "{{.BIN_DIR}}/chromium"
      ZIP_NAME: "chrome-headless-shell-win64.zip"
      DOWNLOAD_URL: "https://storage.googleapis.com/chrome-for-testing-public/{{.CHROMIUM_VERSION}}/win64/{{.ZIP_NAME}}"
    # Status/mkdir/version-write are platform-split on purpose: wails3 ships
    # Task v3.40.x, which predates TASK_CORE_UTILS (mkdir/cat/test on Windows).
    # Without Git usr\bin on PATH, Unix forms fail with exit 127 under plain pwsh.
    status:
      - |
        {{if eq OS "windows"}}
        powershell -NoProfile -Command "\$p = Join-Path '{{.DEST_DIR}}' '.version'; if (-not (Test-Path -LiteralPath \$p)) { exit 1 }; if ((Get-Content -LiteralPath \$p -Raw).Trim() -ne '{{.CHROMIUM_VERSION}}') { exit 1 }"
        {{else}}
        test "$(cat {{.DEST_DIR}}/.version 2>/dev/null)" = "{{.CHROMIUM_VERSION}}"
        {{end}}
    cmds:
      - cmd: mkdir -p "{{.DEST_DIR}}"
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.DEST_DIR}}' | Out-Null"
        platforms: [windows]
      - curl -fsSL "{{.DOWNLOAD_URL}}" -o "{{.BIN_DIR}}/{{.ZIP_NAME}}"
      - cmd: |
          unzip -oq "{{.BIN_DIR}}/{{.ZIP_NAME}}" -d "{{.BIN_DIR}}"
          cp "{{.BIN_DIR}}/chrome-headless-shell-win64/chrome-headless-shell.exe" "{{.DEST_DIR}}/headless-shell.exe"
          rm -rf "{{.BIN_DIR}}/chrome-headless-shell-win64" "{{.BIN_DIR}}/{{.ZIP_NAME}}"
        platforms: [linux, darwin] # covers the GitHub Actions runner (bash) and any WSL/git-bash local run
      - cmd: |
          powershell -NoProfile -Command "Expand-Archive -Path '{{.BIN_DIR}}/{{.ZIP_NAME}}' -DestinationPath '{{.BIN_DIR}}' -Force"
          powershell -NoProfile -Command "Copy-Item '{{.BIN_DIR}}/chrome-headless-shell-win64/*' '{{.DEST_DIR}}/' -Recurse -Force"
          powershell -NoProfile -Command "Copy-Item '{{.DEST_DIR}}/chrome-headless-shell.exe' '{{.DEST_DIR}}/headless-shell.exe' -Force"
          powershell -NoProfile -Command "& { \$b = [System.IO.File]::ReadAllBytes('{{.DEST_DIR}}/headless-shell.exe'); \$off = [BitConverter]::ToInt32(\$b, 0x3C) + 0x5C; if ([BitConverter]::ToUInt16(\$b, \$off) -eq 3) { \$b[\$off] = 2; [System.IO.File]::WriteAllBytes('{{.DEST_DIR}}/headless-shell.exe', \$b) } }"
          powershell -NoProfile -Command "Remove-Item -Recurse -Force '{{.BIN_DIR}}/chrome-headless-shell-win64', '{{.BIN_DIR}}/{{.ZIP_NAME}}'"
        platforms: [windows]
      - cmd: echo "{{.CHROMIUM_VERSION}}" > "{{.DEST_DIR}}/.version"
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "Set-Content -LiteralPath '{{.DEST_DIR}}/.version' -Value '{{.CHROMIUM_VERSION}}' -NoNewline -Encoding ascii"
        platforms: [windows]
